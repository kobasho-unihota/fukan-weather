<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="俯瞰天気">
  <title>俯瞰天気</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style type="text/tailwindcss">
    @layer utilities {
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pl-safe { padding-left: env(safe-area-inset-left); }
      .pr-safe { padding-right: env(safe-area-inset-right); }
    }
    
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .modal-enter { transform: translateY(100%); }
    .modal-enter-active { transform: translateY(0); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-exit { transform: translateY(0); }
    .modal-exit-active { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>

  <script>
    // PWAアイコン
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="#38bdf8"/><path d="M128,40A88,88,0,1,0,216,128,88.1,88.1,0,0,0,128,40Zm0,160a72,72,0,1,1,72-72A72.08,72.08,0,0,1,128,200Z" fill="#ffffff"/><circle cx="128" cy="128" r="48" fill="#facc15"/></svg>`;
    const iconBase64 = 'data:image/svg+xml;base64,' + btoa(iconSvg);

    const manifest = {
      "name": "俯瞰天気",
      "short_name": "俯瞰天気",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#f8fafc",
      "theme_color": "#ffffff",
      "icons": [{ "src": iconBase64, "sizes": "192x192 512x512", "type": "image/svg+xml" }]
    };

    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(manifestLink);

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconBase64;
    document.head.appendChild(appleIcon);

    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => {});
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="fixed top-0 left-0 right-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 pt-safe shadow-sm">
    <div class="flex items-center justify-between px-4 h-14">
      <button id="editBtn" class="text-blue-500 font-medium px-2 py-1 active:opacity-50 transition-opacity">編集</button>
      <h1 class="text-lg font-bold">俯瞰天気</h1>
      <div class="flex items-center gap-1">
        <button id="refreshBtn" class="p-2 text-slate-600 active:opacity-50 transition-opacity rounded-full">
          <i class="ph ph-arrows-clockwise text-xl"></i>
        </button>
        <button id="addBtn" class="p-2 text-blue-500 active:opacity-50 transition-opacity rounded-full">
          <i class="ph ph-plus text-2xl font-bold"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 overflow-y-auto mt-14 pb-safe px-4 py-4 hide-scrollbar">
    <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20 text-slate-400 hidden">
      <i class="ph ph-spinner-gap animate-spin text-4xl mb-2"></i>
      <p class="text-sm">天気データを取得中...</p>
    </div>
    
    <!-- 縦並びのカードグリッド -->
    <div id="weatherGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- カードはJSで動的に生成 -->
    </div>

    <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-slate-500 text-center">
      <i class="ph ph-map-pin text-5xl mb-3 text-slate-300"></i>
      <p class="mb-1 font-bold">地点がありません</p>
      <p class="text-sm text-slate-400 mt-2">右上の「+」ボタンから<br>見たい市区町村を追加してください</p>
    </div>
  </main>

  <!-- オーバーレイ -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/40 z-30 hidden opacity-0 transition-opacity duration-300"></div>

  <!-- 地点検索モーダル -->
  <div id="addModal" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl z-40 h-[85vh] flex flex-col modal-enter pb-safe shadow-2xl" style="display: none;">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <h2 class="text-lg font-bold">地点を検索</h2>
      <button id="closeModalBtn" class="p-2 bg-slate-100 rounded-full text-slate-600 active:bg-slate-200">
        <i class="ph ph-x text-lg"></i>
      </button>
    </div>
    
    <!-- 検索ボックス -->
    <div class="p-4 border-b border-slate-100 bg-slate-50">
      <form id="searchForm" class="flex gap-2">
        <div class="relative flex-1">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <input type="text" id="searchInput" placeholder="例: 新宿区、横浜市" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-base" autocomplete="off">
        </div>
        <button type="submit" class="bg-blue-500 text-white px-5 rounded-xl font-bold active:bg-blue-600 transition-colors shadow-sm">検索</button>
      </form>
    </div>

    <!-- 検索結果リスト -->
    <div class="flex-1 overflow-y-auto hide-scrollbar p-2">
      <div id="searchLoading" class="hidden text-center py-8 text-slate-400">
        <i class="ph ph-spinner-gap animate-spin text-3xl mb-2"></i>
        <p class="text-sm">検索中...</p>
      </div>
      <ul id="searchResultsList" class="divide-y divide-slate-100">
        <!-- 検索結果がここに入ります -->
        <div class="text-center py-12 text-slate-400">
          <i class="ph ph-buildings text-4xl mb-2 opacity-50"></i>
          <p class="text-sm">市区町村名を入力して検索してください</p>
        </div>
      </ul>
    </div>
  </div>

  <script>
    // --- ユーティリティ ---
    function getWeatherInfo(code) {
      if (code === 0 || code === 1) return { icon: 'ph-sun', color: 'text-orange-500', name: '晴れ' };
      if (code === 2) return { icon: 'ph-cloud-sun', color: 'text-yellow-500', name: '晴れ時々曇り' };
      if (code === 3) return { icon: 'ph-cloud', color: 'text-slate-400', name: '曇り' };
      if ([45, 48].includes(code)) return { icon: 'ph-cloud-fog', color: 'text-slate-400', name: '霧' };
      if ([51, 53, 55, 56, 57].includes(code)) return { icon: 'ph-cloud-drizzle', color: 'text-blue-400', name: '霧雨' };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: 'ph-cloud-rain', color: 'text-blue-500', name: '雨' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: 'ph-snowflake', color: 'text-cyan-500', name: '雪' };
      if ([95, 96, 99].includes(code)) return { icon: 'ph-cloud-lightning', color: 'text-purple-500', name: '雷雨' };
      return { icon: 'ph-sun', color: 'text-slate-400', name: '不明' };
    }

    // --- 状態管理 ---
    // 古い形式のデータ(IDのみ)があればクリアしてv2フォーマット(オブジェクト)にする
    const storageKey = 'fukan_weather_locations_v2';
    const defaultLocations = [
      { id: 1850144, name: '東京都', admin: '東京都', lat: 35.6895, lon: 139.6917 },
      { id: 1853909, name: '大阪市', admin: '大阪府', lat: 34.6937, lon: 135.5022 }
    ];
    let savedLocations = JSON.parse(localStorage.getItem(storageKey)) || defaultLocations;
    let isEditMode = false;

    // --- DOM要素 ---
    const grid = document.getElementById('weatherGrid');
    const emptyState = document.getElementById('emptyState');
    const loadingIndicator = document.getElementById('loadingIndicator');
    
    // --- 天気データ取得 ---
    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('API Error');
        return await res.json();
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    async function fetchAndRenderAll() {
      if (savedLocations.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      emptyState.classList.add('hidden');
      grid.innerHTML = '';
      loadingIndicator.classList.remove('hidden');

      const promises = savedLocations.map(loc => {
        return fetchWeather(loc.lat, loc.lon).then(data => ({ loc, data }));
      });

      const results = await Promise.all(promises);
      loadingIndicator.classList.add('hidden');
      grid.innerHTML = '';

      results.forEach(res => {
        if (res && res.data) {
          renderCard(res.loc, res.data);
        }
      });
    }

    // --- カード描画 ---
    function renderCard(loc, data) {
      const daily = data.daily;
      if (!daily || !daily.time) return;

      // 日付データのパース (今日、明日、明後日)
      const days = [0, 1, 2].map(i => {
        const code = daily.weathercode[i];
        const info = getWeatherInfo(code);
        return {
          dateLabel: i === 0 ? '今日' : i === 1 ? '明日' : '明後日',
          icon: info.icon,
          color: info.color,
          maxTemp: Math.round(daily.temperature_2m_max[i]),
          minTemp: Math.round(daily.temperature_2m_min[i]),
          pop: daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : 0
        };
      });

      const today = days[0];
      const tomorrow = days[1];
      const dayAfter = days[2];

      const deleteBadge = `
        <button onclick="removeLocation(${loc.id})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md z-10 transition-transform ${isEditMode ? 'scale-100' : 'scale-0'}">
          <i class="ph ph-x text-sm font-bold"></i>
        </button>
      `;

      const cardHTML = `
        <div class="relative bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col ${isEditMode ? 'animate-pulse' : ''}" data-id="${loc.id}">
          ${deleteBadge}
          
          <div class="mb-3">
            <h3 class="font-bold text-slate-800 text-lg leading-tight">${loc.name}</h3>
            ${loc.admin && loc.admin !== loc.name ? `<p class="text-xs text-slate-400">${loc.admin}</p>` : ''}
          </div>
          
          <!-- 今日 -->
          <div class="flex items-center justify-between p-3 bg-blue-50/60 rounded-xl mb-3">
            <div class="flex flex-col gap-1">
              <span class="text-sm font-bold text-slate-600">今日</span>
              <div class="flex items-center text-xs font-bold ${today.pop >= 40 ? 'text-blue-500' : 'text-slate-400'}">
                <i class="ph ph-drop mr-0.5"></i>${today.pop}%
              </div>
            </div>
            
            <i class="ph ${today.icon} ${today.color} text-5xl drop-shadow-sm"></i>
            
            <div class="text-right flex flex-col items-end">
              <span class="text-xl font-bold text-red-500 leading-none mb-1">${today.maxTemp}°</span>
              <span class="text-lg font-bold text-blue-500 leading-none">${today.minTemp}°</span>
            </div>
          </div>

          <!-- 明日・明後日 -->
          <div class="grid grid-cols-2 gap-3">
            <!-- 明日 -->
            <div class="p-2.5 bg-slate-50 rounded-xl flex flex-col items-center">
              <span class="text-xs font-bold text-slate-500 mb-2">明日</span>
              <i class="ph ${tomorrow.icon} ${tomorrow.color} text-3xl mb-2 drop-shadow-sm"></i>
              <div class="text-sm font-bold mb-1">
                <span class="text-red-500">${tomorrow.maxTemp}°</span>
                <span class="text-slate-300 mx-0.5">/</span>
                <span class="text-blue-500">${tomorrow.minTemp}°</span>
              </div>
              <span class="text-[10px] font-bold ${tomorrow.pop >= 40 ? 'text-blue-500' : 'text-slate-400'}">
                <i class="ph ph-drop"></i> ${tomorrow.pop}%
              </span>
            </div>

            <!-- 明後日 -->
            <div class="p-2.5 bg-slate-50 rounded-xl flex flex-col items-center">
              <span class="text-xs font-bold text-slate-500 mb-2">明後日</span>
              <i class="ph ${dayAfter.icon} ${dayAfter.color} text-3xl mb-2 drop-shadow-sm"></i>
              <div class="text-sm font-bold mb-1">
                <span class="text-red-500">${dayAfter.maxTemp}°</span>
                <span class="text-slate-300 mx-0.5">/</span>
                <span class="text-blue-500">${dayAfter.minTemp}°</span>
              </div>
              <span class="text-[10px] font-bold ${dayAfter.pop >= 40 ? 'text-blue-500' : 'text-slate-400'}">
                <i class="ph ph-drop"></i> ${dayAfter.pop}%
              </span>
            </div>
          </div>
        </div>
      `;
      
      grid.insertAdjacentHTML('beforeend', cardHTML);
    }

    // --- 地点検索 (Geocoding API) ---
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchResultsList = document.getElementById('searchResultsList');
    const searchLoading = document.getElementById('searchLoading');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      // UI状態更新
      searchInput.blur();
      searchResultsList.innerHTML = '';
      searchLoading.classList.remove('hidden');

      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=ja&format=json`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        searchLoading.classList.add('hidden');

        if (!data.results || data.results.length === 0) {
          searchResultsList.innerHTML = `
            <div class="text-center py-8 text-slate-500">
              <p>「${query}」が見つかりませんでした。</p>
              <p class="text-xs text-slate-400 mt-2">別のキーワードでお試しください</p>
            </div>
          `;
          return;
        }

        searchResultsList.innerHTML = data.results.map(result => {
          // すでに登録済みかチェック
          const isAdded = savedLocations.some(loc => loc.id === result.id);
          const adminName = result.admin1 ? result.admin1 : (result.country || '');
          
          return `
            <li class="px-2 py-1">
              <button 
                onclick="addLocation(${result.id}, '${result.name}', '${adminName}', ${result.latitude}, ${result.longitude})" 
                class="w-full text-left px-4 py-3 rounded-xl flex items-center justify-between active:bg-slate-100 transition-colors ${isAdded ? 'opacity-50 cursor-not-allowed' : ''}"
                ${isAdded ? 'disabled' : ''}
              >
                <div>
                  <span class="font-bold text-slate-700">${result.name}</span>
                  <span class="text-xs text-slate-400 ml-2">${adminName}</span>
                </div>
                ${isAdded ? '<i class="ph ph-check-circle text-blue-500 text-xl"></i>' : '<i class="ph ph-plus-circle text-slate-300 text-xl"></i>'}
              </button>
            </li>
          `;
        }).join('');

      } catch (err) {
        searchLoading.classList.add('hidden');
        searchResultsList.innerHTML = `<div class="text-center py-8 text-red-500">通信エラーが発生しました</div>`;
      }
    });

    // --- データ操作 ---
    window.addLocation = function(id, name, admin, lat, lon) {
      if (!savedLocations.some(loc => loc.id === id)) {
        savedLocations.push({ id, name, admin, lat, lon });
        localStorage.setItem(storageKey, JSON.stringify(savedLocations));
        fetchAndRenderAll();
      }
      closeModal();
    };

    window.removeLocation = function(id) {
      savedLocations = savedLocations.filter(loc => loc.id !== id);
      localStorage.setItem(storageKey, JSON.stringify(savedLocations));
      
      const card = document.querySelector(`[data-id="${id}"]`);
      if(card) {
        card.style.transform = 'scale(0.9)';
        card.style.opacity = '0';
        card.style.transition = 'all 0.2s ease-out';
        setTimeout(() => fetchAndRenderAll(), 200);
      } else {
        fetchAndRenderAll();
      }
    };

    // --- モーダル・UI制御 ---
    const editBtn = document.getElementById('editBtn');
    editBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      editBtn.textContent = isEditMode ? '完了' : '編集';
      editBtn.classList.toggle('text-red-500', isEditMode);
      editBtn.classList.toggle('text-blue-500', !isEditMode);
      
      document.querySelectorAll('#weatherGrid > div').forEach(card => {
        const badge = card.querySelector('button');
        if (isEditMode) {
          badge.classList.remove('scale-0');
          badge.classList.add('scale-100');
        } else {
          badge.classList.remove('scale-100');
          badge.classList.add('scale-0');
        }
      });
    });

    const addModal = document.getElementById('addModal');
    const modalOverlay = document.getElementById('modalOverlay');

    function openModal() {
      // 検索状態をリセット
      searchInput.value = '';
      searchResultsList.innerHTML = `
        <div class="text-center py-12 text-slate-400">
          <i class="ph ph-buildings text-4xl mb-2 opacity-50"></i>
          <p class="text-sm">市区町村名を入力して検索してください</p>
        </div>
      `;
      
      addModal.style.display = 'flex';
      modalOverlay.classList.remove('hidden');
      
      requestAnimationFrame(() => {
        addModal.classList.remove('modal-enter');
        addModal.classList.add('modal-enter-active');
        modalOverlay.classList.remove('opacity-0');
        modalOverlay.classList.add('opacity-100');
        
        // 少し遅延させてからフォーカスを当てる（モバイルSafariのキーボード対策）
        setTimeout(() => searchInput.focus(), 300);
      });
    }

    function closeModal() {
      addModal.classList.remove('modal-enter-active');
      addModal.classList.add('modal-exit-active');
      modalOverlay.classList.remove('opacity-100');
      modalOverlay.classList.add('opacity-0');
      searchInput.blur(); // キーボードを閉じる

      setTimeout(() => {
        addModal.style.display = 'none';
        addModal.classList.remove('modal-exit-active');
        addModal.classList.add('modal-enter');
        modalOverlay.classList.add('hidden');
      }, 300);
    }

    document.getElementById('addBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.addEventListener('click', () => {
      const icon = refreshBtn.querySelector('i');
      icon.classList.add('animate-spin');
      fetchAndRenderAll().then(() => {
        setTimeout(() => icon.classList.remove('animate-spin'), 500);
      });
    });

    // 起動
    fetchAndRenderAll();

  </script>
</body>
</html>
